<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>नौकरी डालें - SecurityHire</title>

<meta name="google-site-verification" content="c5BKbJ1JwhErZBmkNowyEthsh-8SVExbUUx9ZCqr5Po" />
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0b1220; color: #fff; padding: 20px; padding-bottom: 50px; }
  
  /* हेडर */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #2b3b55; }
  .back-btn { color: #fff; text-decoration: none; font-size: 15px; }
  header h1 { font-size: 18px; color: #ffa500; }

  /* फॉर्म कार्ड */
  .card { background: #141e30; border: 1px solid #2b3b55; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .card-title { color: #ffa500; font-size: 16px; margin-bottom: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }

  /* इनपुट फील्ड्स */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 14px; color: #9fc0e8; margin-bottom: 6px; }
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
    width: 100%; padding: 12px; background: #0b1220; border: 1px solid #2b3b55; border-radius: 8px; color: #fff; font-size: 15px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: #1e6fd9; }
  textarea { resize: vertical; height: 80px; }

  /* चेकबॉक्स ग्रिड */
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #d1d8e0; cursor: pointer; background: #0b1220; padding: 10px; border-radius: 8px; border: 1px solid #2b3b55; }
  .checkbox-item input[type="checkbox"] { transform: scale(1.3); accent-color: #1e6fd9; }

  /* सबमिट बटन */
  .btn-submit { width: 100%; padding: 15px; background: #1e6fd9; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-submit:active { background: #1655a8; }

  /* डेटा वेरिफिकेशन बॉक्स (लाल रंग की जगह नीला/हरा) */
  .verify-box { background: rgba(30, 111, 217, 0.1); border: 1px solid #1e6fd9; padding: 15px; border-radius: 8px; margin-top: 20px; margin-bottom: 20px; }
  .verify-box h4 { color: #5cb85c; margin-bottom: 10px; font-size: 14px; }
  .rule-label { display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; font-size: 13px; color: #fff; cursor: pointer; line-height: 1.4; }
  .rule-label input { margin-top: 3px; transform: scale(1.2); accent-color: #1e6fd9; }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← होम</a>
    <h1>📢 नौकरी डालें</h1>
  </header>

  <!-- नौकरी की जानकारी -->
  <div class="card">
    <div class="card-title">📝 नौकरी की जानकारी</div>
    
    <div class="form-group">
      <label>नौकरी का प्रकार (Job Category)</label>
      <select id="jobCategory" required>
        <option value="Security">🛡️ सिक्योरिटी (Security)</option>
        <option value="Labour">👷 लेबर / मजदूर (Labour)</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" id="jobTitle" placeholder="पद (जैसे: Security Guard / Mason / Helper)" required>
    </div>

    <!-- All India Location -->
    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <select id="state" required>
          <option value="">राज्य चुनें</option>
          <option value="Maharashtra">महाराष्ट्र</option>
          <option value="Delhi">दिल्ली</option>
          <option value="Uttar Pradesh">उत्तर प्रदेश</option>
          <option value="Bihar">बिहार</option>
          <option value="Gujarat">गुजरात</option>
          <option value="Karnataka">कर्नाटक</option>
          <option value="Other">अन्य (Other)</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1;">
        <input type="text" id="city" placeholder="शहर (City)" required>
      </div>
    </div>

    <div class="form-group">
      <input type="text" id="salary" placeholder="सैलरी / डेली वेज (जैसे: ₹18,000 या ₹500/दिन)" required>
    </div>

    <div class="form-group">
      <label>📄 काम का विवरण:</label>
      <textarea id="jobDesc" placeholder="जिम्मेदारियां और काम की जानकारी लिखें..."></textarea>
    </div>
  </div>

  <!-- ठेकेदार / कंपनी की पहचान (सबसे जरुरी) -->
  <div class="card">
    <div class="card-title">🛡️ कंपनी / ठेकेदार की पहचान (अनिवार्य)</div>
    
    <div class="form-group">
      <input type="text" id="companyName" placeholder="कंपनी या ठेकेदार का पूरा नाम" required>
    </div>
    <div class="form-group">
      <input type="text" id="ownerName" placeholder="मालिक का नाम (Owner Name)" required>
    </div>
    <div class="form-group">
      <input type="text" id="licenseNo" placeholder="PSARA / लेबर लाइसेंस नंबर" required>
    </div>
    <div class="form-group">
      <textarea id="fullAddress" placeholder="कंपनी का पूरा पता (ऑफिस एड्रेस)" required></textarea>
    </div>
    <div class="form-group">
      <input type="text" id="mapLocation" placeholder="Google Maps लोकेशन लिंक (वैकल्पिक)">
    </div>
  </div>

  <!-- संपर्क जानकारी -->
  <div class="card">
    <div class="card-title">📞 संपर्क</div>
    <div class="form-group">
      <input type="text" id="phone" placeholder="मोबाइल नंबर (10 अंक)" required>
    </div>
    <div class="form-group">
      <input type="email" id="contactEmail" placeholder="ईमेल आईडी (Official Email)" required>
    </div>
  </div>

  <!-- ⚠️ कानूनी चेतावनी (Fake नहीं, बस एक Declaration) -->
  <div class="verify-box">
    <h4>⚠️ कानूनी घोषणा (Legal Declaration):</h4>
    <p style="font-size: 13px; color: #9fc0e8; margin-bottom: 10px;">
      SecurityHire एक मध्यस्थ (Platform) है। यहाँ दी गई जानकारी की सत्यता की जिम्मेदारी पूरी तरह से ठेकेदार/कंपनी की है।
    </p>
    <label class="rule-label">
      <input type="checkbox" id="ruleDeclaration" required>
      <span>मैं पुष्टि करता हूँ कि ऊपर दी गई सभी जानकारी (लाइसेंस, पता, नाम) सही है। अगर यह झूठी पाई जाती है, तो मेरे खिलाफ <b>पुलिस में FIR (धोखाधड़ी)</b> दर्ज की जा सकती है।</span>
    </label>
  </div>

  <button class="btn-submit" onclick="postJob()">✅ नौकरी पोस्ट करें</button>

  <script>
    function postJob() {
      // जरुरी जानकारी चेक करना
      const title = document.getElementById('jobTitle').value;
      const comp = document.getElementById('companyName').value;
      const lic = document.getElementById('licenseNo').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('fullAddress').value;
      const isDeclared = document.getElementById('ruleDeclaration').checked;

      if(!title || !comp || !lic || !phone || !address) {
        alert("कृपया पद, कंपनी का नाम, लाइसेंस नंबर, पता और फोन नंबर भरें!");
        return;
      }
      if(!isDeclared) {
        alert("कृपया कानूनी घोषणा वाले बॉक्स को टिक (Check) करें!");
        return;
      }
      
      alert("आपकी नौकरी की जानकारी सबमिट हो गई है। एडमिन द्वारा जांच के बाद इसे लाइव किया जाएगा।");
      // यहाँ आगे Firebase/डेटाबेस का कोड जुड़ेगा
      window.location.href = "index.html"; // सबमिट के बाद होम पेज पर भेजें
    }
  </script>
</body>
</html>
