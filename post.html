<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>नौकरी डालें - SecurityHire</title>

<meta name="google-site-verification" content="c5BKbJ1JwhErZBmkNowyEthsh-8SVExbUUx9ZCqr5Po" />
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0b1220; color: #fff; padding: 20px; padding-bottom: 50px; }
  
  /* हेडर */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #2b3b55; }
  .back-btn { color: #fff; text-decoration: none; font-size: 15px; }
  header h1 { font-size: 18px; color: #ffa500; }

  /* अलर्ट मैसेज */
  .alert { background-color: rgba(211, 47, 47, 0.1); border: 1px solid #d32f2f; color: #ff6b6b; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; display: none; }

  /* फॉर्म कार्ड */
  .card { background: #141e30; border: 1px solid #2b3b55; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .card-title { color: #ffa500; font-size: 16px; margin-bottom: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }

  /* इनपुट फील्ड्स */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 14px; color: #9fc0e8; margin-bottom: 6px; }
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
    width: 100%; padding: 12px; background: #0b1220; border: 1px solid #2b3b55; border-radius: 8px; color: #fff; font-size: 15px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: #1e6fd9; }
  textarea { resize: vertical; height: 80px; }

  /* चेकबॉक्स ग्रिड */
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #d1d8e0; cursor: pointer; background: #0b1220; padding: 10px; border-radius: 8px; border: 1px solid #2b3b55; }
  .checkbox-item input[type="checkbox"] { transform: scale(1.3); accent-color: #1e6fd9; }

  /* सबमिट बटन */
  .btn-submit { width: 100%; padding: 15px; background: #1e6fd9; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-submit:active { background: #1655a8; }

  /* सख्त नियम वाला बॉक्स (Escrow & Rules) */
  .rules-box { background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; padding: 15px; border-radius: 8px; margin-top: 20px; margin-bottom: 20px; }
  .rules-box h4 { color: #ff4757; margin-bottom: 10px; font-size: 14px; }
  .rule-label { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 13px; color: #fff; cursor: pointer; line-height: 1.4; }
  .rule-label input { margin-top: 3px; transform: scale(1.2); accent-color: #ff4757; }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← होम</a>
    <h1>📢 नौकरी डालें</h1>
  </header>

  <div id="alertBox" class="alert">सही ईमेल डालें।</div>

  <!-- एम्प्लॉयर लॉगिन / साइनअप -->
  <div class="card">
    <div class="card-title">🔐 एम्प्लॉयर लॉगिन / साइनअप</div>
    <div class="form-group">
      <input type="email" id="empEmail" placeholder="ईमेल आईडी (Email)">
    </div>
    <div class="form-group">
      <input type="password" id="empPass" placeholder="पासवर्ड (6+ अक्षर)">
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn-submit" style="background: #2b3b55;" onclick="login()">लॉगिन</button>
      <button class="btn-submit" onclick="signup()">नया अकाउंट</button>
    </div>
  </div>

  <!-- नौकरी की जानकारी -->
  <div class="card">
    <div class="card-title">📝 नौकरी की जानकारी</div>
    
    <div class="form-group">
      <label>नौकरी का प्रकार (Job Category)</label>
      <select id="jobCategory" required>
        <option value="Security">🛡️ सिक्योरिटी (Security)</option>
        <option value="Labour">👷 लेबर / मजदूर (Labour)</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" id="jobTitle" placeholder="पद (जैसे: Security Guard / Mason / Helper)" required>
    </div>
    <div class="form-group">
      <input type="text" id="companyName" placeholder="कंपनी / ठेकेदार का नाम" required>
    </div>

    <!-- All India Location -->
    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <select id="state" required>
          <option value="">राज्य चुनें</option>
          <option value="Maharashtra">महाराष्ट्र</option>
          <option value="Delhi">दिल्ली</option>
          <option value="Uttar Pradesh">उत्तर प्रदेश</option>
          <option value="Bihar">बिहार</option>
          <option value="Gujarat">गुजरात</option>
          <option value="Karnataka">कर्नाटक</option>
          <option value="Other">अन्य (Other)</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1;">
        <input type="text" id="city" placeholder="शहर (City)" required>
      </div>
    </div>

    <div class="form-group">
      <input type="text" id="experience" placeholder="अनुभव (जैसे: 2-3 साल / फ्रेशर)">
    </div>
    <div class="form-group">
      <input type="text" id="salary" placeholder="सैलरी / डेली वेज (जैसे: ₹18,000 या ₹500/दिन)" required>
    </div>
    <div class="form-group">
      <input type="text" id="dutyHours" placeholder="ड्यूटी के घंटे (जैसे: 8 घंटे, 12 घंटे)">
    </div>

    <div class="form-group">
      <label>✅ सुविधाएं (जो मिलती हैं, टिक करें):</label>
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" value="ESI"> ESI</label>
        <label class="checkbox-item"><input type="checkbox" value="PF"> PF</label>
        <label class="checkbox-item"><input type="checkbox" value="Bonus"> बोनस</label>
        <label class="checkbox-item"><input type="checkbox" value="Paid Leave"> पेड लीव</label>
        <label class="checkbox-item"><input type="checkbox" value="Room"> रहने का रूम</label>
        <label class="checkbox-item"><input type="checkbox" value="Food"> खाना</label>
      </div>
    </div>

    <div class="form-group">
      <label>🎯 स्किल्स (जो लागू हों, टिक करें):</label>
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" value="Physical Guarding"> फिजिकल गार्डिंग</label>
        <label class="checkbox-item"><input type="checkbox" value="Mason/Helper"> मिस्त्री / हेल्पर</label>
        <label class="checkbox-item"><input type="checkbox" value="Plumbing/Electrical"> प्लंबिंग / इलेक्ट्रिकल</label>
        <label class="checkbox-item"><input type="checkbox" value="CCTV"> सीसीटीवी (CCTV)</label>
        <label class="checkbox-item"><input type="checkbox" value="Fire Safety"> फायर एंड सेफ्टी</label>
        <label class="checkbox-item"><input type="checkbox" value="Loading/Unloading"> लोडिंग / अनलोडिंग</label>
      </div>
    </div>

    <div class="form-group">
      <label>📄 काम का विवरण:</label>
      <textarea id="jobDesc" placeholder="जिम्मेदारियां और काम की जानकारी लिखें..."></textarea>
    </div>
  </div>

  <!-- संपर्क जानकारी -->
  <div class="card">
    <div class="card-title">📞 संपर्क (जो देना चाहें)</div>
    <div class="form-group">
      <input type="text" id="phone" placeholder="फोन नंबर (10 अंक)" required>
    </div>
    <div class="form-group">
      <input type="text" id="whatsapp" placeholder="WhatsApp नंबर (10 अंक)">
    </div>
    <div class="form-group">
      <input type="email" id="contactEmail" placeholder="ईमेल आईडी">
    </div>
  </div>

  <!-- 🚨 सख्त नियम (Escrow & Legal) -->
  <div class="rules-box">
    <h4>⚠️ ठेकेदार के लिए सख्त नियम (अनिवार्य):</h4>
    
    <label class="rule-label">
      <input type="checkbox" id="rulePSARA" required>
      <span>मेरे पास इस काम के लिए वैध <b>PSARA / लेबर लाइसेंस</b> है।</span>
    </label>

    <label class="rule-label">
      <input type="checkbox" id="ruleEscrow" required>
      <span>मैं <b>एस्क्रो पेमेंट (Escrow)</b> प्रणाली से सहमत हूँ। पैसा पहले प्लेटफॉर्म पर जमा होगा, काम के बाद मिलेगा।</span>
    </label>

    <label class="rule-label">
      <input type="checkbox" id="rulePenalty" required>
      <span>अगर मैं काम के बीच में भागता हूँ, तो मेरी सिक्योरिटी राशि जब्त होगी और <b>कानूनी कार्रवाई (FIR)</b> होगी।</span>
    </label>
  </div>

  <button class="btn-submit" onclick="postJob()">✅ नौकरी पोस्ट करें</button>

  <script>
    function postJob() {
      // यहाँ हम चेक करेंगे कि सारे जरूरी बॉक्स भरे हैं या नहीं
      const p = document.getElementById('phone').value;
      const t = document.getElementById('jobTitle').value;
      const r1 = document.getElementById('rulePSARA').checked;
      const r2 = document.getElementById('ruleEscrow').checked;
      const r3 = document.getElementById('rulePenalty').checked;

      if(!t || !p) {
        alert("कृपया पद (Title) और फोन नंबर भरें!");
        return;
      }
      if(!r1 || !r2 || !r3) {
        alert("कृपया नीचे दिए गए सभी सख्त नियमों को टिक (Check) करें!");
        return;
      }
      
      alert("नौकरी सफलतापूर्वक पोस्ट हो गई! (डेटाबेस कनेक्ट होने पर यह वेबसाइट पर दिखेगी)");
      // यहाँ आगे Firebase/डेटाबेस का कोड जुड़ेगा
    }
  </script>
  <!-- Firebase Configuration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    const firebaseConfig = {
      authDomain: "securityhire-fc26f.firebaseapp.com",
      projectId: "securityhire-fc26f",
      storageBucket: "securityhire-fc26f.firebasestorage.app",
      messagingSenderId: "234313705418",
      appId: "1:234313705418:web:4fce21c507d0b3a8d75d33",
      measurementId: "G-84P3Q1NCY7"
    };
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>
</body>
